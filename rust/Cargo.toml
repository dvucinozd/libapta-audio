# SPDX-License-Identifier: Apache-2.0
[package]
name = "libapta"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "In-progress native Rust implementation of APTA audio analysis"
publish = false

[features]
experimental-s6-history = []
experimental-s6-attack-grid = ["experimental-s6-history"]
experimental-s6-onset-grid = ["experimental-s6-attack-grid"]
experimental-s6-onset-trace = ["experimental-s6-onset-grid"]
experimental-s6-temporal-trace = ["experimental-s6-onset-trace"]

[dependencies]
libm = { version = "0.2", default-features = false }
