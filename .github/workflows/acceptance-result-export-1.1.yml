name: APTA 1.1 acceptance result export

on:
  pull_request:
    paths:
      - "tools/apta_1_1_export_acceptance_results.py"
      - "tests/unit/apta_1_1_export_acceptance_results.py"
      - ".github/workflows/acceptance-result-export-1.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-export-contract:
    name: Frozen acceptance result export
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile exporter
        run: python3 -m py_compile tools/apta_1_1_export_acceptance_results.py tests/unit/apta_1_1_export_acceptance_results.py

      - name: Run exporter tests
        run: python3 -m unittest tests/unit/apta_1_1_export_acceptance_results.py
