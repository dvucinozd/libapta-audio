name: Finalize S9 P1 documentation

on:
  push:
    branches:
      - agent/s9-p1-normative-scope
    paths:
      - .github/workflows/finalize-s9-p1-docs.yml

permissions:
  contents: write

jobs:
  normalize-verify-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/s9-p1-normative-scope

      - name: Normalize and verify P1 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.').resolve()
          manifest_path = Path('specification/APTA-1.0-NORMATIVE-MANIFEST.md')
          report_path = Path('docs/status/S9-P1-DOCUMENTATION-CHECK.md')
          workflow_path = Path('.github/workflows/finalize-s9-p1-docs.yml')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True).splitlines()
          markdown = [Path(p) for p in changed if p.endswith('.md') and Path(p).exists()]

          for path in markdown:
              if path in (manifest_path, report_path):
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')

          normative = [
              'specification/APTA-SPEC.md',
              'specification/normative-language.md',
              'specification/terminology.md',
              'specification/time-model.md',
              'specification/pcm-input.md',
              'specification/progressive-scheduling.md',
              'specification/waveform.md',
              'specification/tempo.md',
              'specification/beatgrid.md',
              'specification/lifecycle.md',
              'specification/confidence.md',
              'specification/result-model.md',
              'specification/file-format.md',
              'specification/global-grid-container.md',
              'specification/wovr-state-flags.md',
              'specification/profiles.md',
              'specification/extensions.md',
              'specification/conformance.md',
          ]

          manifest = [
              '# APTA 1.0 normative manifest',
              '',
              '**Status:** Release Candidate Draft manifest',
              '**Candidate:** APTA 1.0',
              '**Hash domain:** Git blob SHA-1 of UTF-8 file content',
              '',
              '## 1. Authority',
              '',
              'The files below are the complete normative release-candidate set. A path not',
              'listed here is informative unless one of these documents normatively',
              'incorporates it.',
              '',
              'The manifest does not list its own blob hash because that would be',
              'self-referential. The enclosing Git commit or release tag identifies the exact',
              'manifest instance.',
              '',
              '## 2. Candidate files',
              '',
              '| Path | Title | Git blob SHA-1 |',
              '|---|---|---|',
          ]
          for name in normative:
              path = Path(name)
              blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              title = path.read_text(encoding='utf-8').splitlines()[0].lstrip('# ').strip()
              manifest.append(f'| `{path.name}` | {title} | `{blob}` |')
          manifest += [
              '',
              '## 3. Change control',
              '',
              'Any change to a listed file changes its blob hash and requires a manifest',
              'update. A normative change also requires compatibility impact, implementation',
              'and conformance review under project governance. Editorial corrections may',
              'change hashes without changing the specification version only when they do not',
              'alter requirements.',
              '',
              'Final APTA 1.0 publication will replace the candidate label and pin this',
              'manifest through the accepted release tag.',
              '',
          ]
          manifest_path.write_text('\n'.join(manifest), encoding='utf-8')

          # Remove this one-shot workflow before evaluating the final diff.
          workflow_path.unlink()

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True).splitlines()
          markdown = [Path(p) for p in changed if p.endswith('.md') and Path(p).exists() and p != str(report_path)]

          missing = []
          for path in markdown:
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  raw = match.group(1).strip()
                  if not raw or raw.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = raw.split('#', 1)[0]
                  if target and not (path.parent / target).resolve().exists():
                      missing.append((str(path), raw))

          whitespace = subprocess.run(
              ['git', 'diff', '--check', 'origin/main...HEAD'],
              text=True,
              capture_output=True)
          passed = whitespace.returncode == 0 and not missing

          report = [
              '# Stage S9 P1 documentation verification',
              '',
              f'**Result:** {"PASS" if passed else "FAIL"}',
              f'**Scope:** {len(markdown)} changed Markdown files relative to `origin/main`',
              '',
              '## Whitespace',
              '',
          ]
          if whitespace.returncode == 0:
              report.append('`git diff --check origin/main...HEAD` passed.')
          else:
              report += ['```text', (whitespace.stdout + whitespace.stderr).rstrip(), '```']

          report += ['', '## Local links', '']
          if not missing:
              report.append('Every local Markdown link in the changed files resolves in the checked-out tree.')
          else:
              report += [f'- `{path}` → `{target}`' for path, target in missing]

          report += [
              '',
              '## Interpretation',
              '',
              'This report checks repository-local Markdown targets and whitespace for the P1 diff. External URLs and anchor existence inside a target file are outside this bounded gate.',
              '',
          ]
          report_path.write_text('\n'.join(report), encoding='utf-8')

          if not passed:
              raise SystemExit('P1 documentation verification failed; inspect the committed report source logic locally')
          PY

      - name: Commit normalized documents and PASS report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(s9): finalize P1 normative documentation"
          git push origin HEAD:agent/s9-p1-normative-scope
