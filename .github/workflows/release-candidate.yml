name: APTA 1.0 release candidate (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-history-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APTA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  mode:
    name: Detect release mode
    runs-on: ubuntu-latest
    outputs:
      is_rc: ${{ steps.detect.outputs.is_rc }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
      - name: Detect RC version
        id: detect
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${version}" == 1.0.0-rc.* ]]; then
            echo "is_rc=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_rc=false" >> "${GITHUB_OUTPUT}"
          fi

  rc-audit:
    name: Historical RC freeze and legal audit
    needs: mode
    if: needs.mode.outputs.is_rc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact RC revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          fetch-depth: 0
      - name: Verify frozen RC contracts
        run: >-
          python3 release/check_rc_freeze.py
          --root .
          --manifest release/rc-freeze-v1.json
          --source-revision "${APTA_SOURCE_REVISION}"
          --output rc-reports/rc-freeze-report.json
      - name: Verify RC legal review
        run: >-
          python3 release/check_legal_review.py
          --root .
          --manifest release/legal-review-v1.json
          --source-revision "${APTA_SOURCE_REVISION}"
          --output rc-reports/legal-review-report.json
      - name: Upload historical RC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apta-rc-historical-attempt-${{ github.run_attempt }}
          path: rc-reports/*.json
          if-no-files-found: error
          retention-days: 180

  final-version:
    name: RC workflow superseded by final release
    needs: mode
    if: needs.mode.outputs.is_rc != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Final versions are validated by .github/workflows/release.yml"
