name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-abi-bootstrap:
    name: Apply P2 ABI freeze
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/s9-p2-api-abi-freeze'
    runs-on: ubuntu-latest

    steps:
      - name: Check out P2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/s9-p2-api-abi-freeze

      - name: Install multilib toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Apply ABI freeze
        run: python3 .github/scripts/apply_s9_p2_abi.py

      - name: Commit ABI freeze and restore CI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(s9): freeze the APTA 1.0 public ABI"
          git push origin HEAD:agent/s9-p2-api-abi-freeze

  core-build:
    name: Core build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile library and API checks
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure shared-library ABI build
        run: >-
          cmake -S . -B build-shared
          -DBUILD_SHARED_LIBS=ON
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF
          -DAPTA_BUILD_TOOLS=OFF
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile shared library and ABI checks
        run: cmake --build build-shared --parallel 2

      - name: Run shared-library ABI tests
        run: ctest --test-dir build-shared --output-on-failure

  windows-core:
    name: Windows core build and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-windows
          -DBUILD_SHARED_LIBS=ON
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=ON
          -DAPTA_BUILD_TOOLS=ON
          -DAPTA_WARNINGS_AS_ERRORS=ON

      - name: Compile library and tests
        run: cmake --build build-windows --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-windows -C Release --output-on-failure

  core-build-32:
    name: 32-bit core build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install multilib toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Configure
        env:
          CFLAGS: -m32
          CXXFLAGS: -m32
          LDFLAGS: -m32
        run: >-
          cmake -S . -B build-32
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF
          -DAPTA_BUILD_TOOLS=OFF
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile library and tests
        run: cmake --build build-32 --parallel 2

      - name: Run tests
        run: ctest --test-dir build-32 --output-on-failure

  parser-hardening:
    name: Parser sanitizers and fuzz smoke
    runs-on: ubuntu-latest

    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure sanitized parser build
        run: >-
          cmake -S . -B build-sanitized
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_ENABLE_SANITIZERS=ON
          -DAPTA_BUILD_FUZZING=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Compile sanitized tests and fuzz target
        run: cmake --build build-sanitized --parallel 2

      - name: Run sanitized runtime tests
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Generate canonical fuzz seeds
        run: |
          mkdir -p build-sanitized/fuzz-corpus
          cd build-sanitized/fuzz-corpus
          ../tests/apta_wovr_seed_generator
          ../tests/apta_s6_seed_generator
          test -s valid-final.apta
          test -s valid-sparse-partial.apta
          test -s valid-wdtl.apta
          test -s valid-meta.apta
          test -s valid-s4.apta
          test -s valid-s6.apta

      - name: Run bounded fuzz smoke
        run: >-
          ./build-sanitized/tests/apta_wovr_reader_fuzz
          build-sanitized/fuzz-corpus
          -dict=tests/fuzz/wovr_reader.dict
          -runs=2000
          -max_len=4096
          -timeout=5
