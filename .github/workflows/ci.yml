name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-build:
    name: Core build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DAPTA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Compile library and API checks
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  parser-hardening:
    name: Parser sanitizers and fuzz smoke
    runs-on: ubuntu-latest

    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure sanitized parser build
        run: >-
          cmake -S . -B build-sanitized
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_ENABLE_SANITIZERS=ON
          -DAPTA_BUILD_FUZZING=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Compile sanitized tests and fuzz target
        run: cmake --build build-sanitized --parallel 2

      - name: Run sanitized runtime tests
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Generate canonical fuzz seeds
        run: |
          mkdir -p build-sanitized/fuzz-corpus
          cd build-sanitized/fuzz-corpus
          ../tests/apta_wovr_seed_generator
          test -s valid-final.apta
          test -s valid-sparse-partial.apta
          test -s valid-wdtl.apta
          test -s valid-meta.apta
          test -s valid-s4.apta

      - name: Run bounded fuzz smoke
        run: >-
          ./build-sanitized/tests/apta_wovr_reader_fuzz
          build-sanitized/fuzz-corpus
          -dict=tests/fuzz/wovr_reader.dict
          -runs=2000
          -max_len=4096
          -timeout=5
