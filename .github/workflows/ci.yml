name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APTA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  core-build:
    name: Core build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          persist-credentials: false

      - name: Verify immutable workflow references
        run: >-
          python3 security/automation/check_workflow_pins.py
          --root .
          --output build/security/action-pins.json

      - name: Test deterministic SPDX generator
        run: python3 release/test_spdx_sbom.py

      - name: Configure
        run: >-
          cmake -S . -B build
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_EXAMPLES=ON
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile library and API checks
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure shared-library ABI build
        run: >-
          cmake -S . -B build-shared
          -DBUILD_SHARED_LIBS=ON
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF
          -DAPTA_BUILD_TOOLS=OFF
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile shared library and ABI checks
        run: >-
          cmake --build build-shared
          --target apta_core apta_abi_layout_manifest apta_compat_1_0_client
          --parallel 2

      - name: Run shared-library ABI, conformance and interchange tests
        run: >-
          ctest --test-dir build-shared
          -R "^(apta\.abi\..*|apta\.conformance\.installed|apta\.interchange\.versioned)$"
          --timeout 600
          --verbose
          --output-on-failure

      - name: Upload Linux conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apta-conformance-linux-attempt-${{ github.run_attempt }}
          path: |
            build/conformance-reports/*.json
            build-shared/conformance-reports/*.json
          if-no-files-found: warn
          retention-days: 30

  windows-core:
    name: Windows core build and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build-windows
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_EXAMPLES=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=ON
          -DAPTA_BUILD_TOOLS=ON
          -DAPTA_WARNINGS_AS_ERRORS=ON

      - name: Compile library and tests
        run: cmake --build build-windows --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Configure shared-library ABI build
        run: >-
          cmake -S . -B build-windows-shared
          -DBUILD_SHARED_LIBS=ON
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF
          -DAPTA_BUILD_TOOLS=OFF
          -DAPTA_WARNINGS_AS_ERRORS=ON

      - name: Compile shared library and ABI checks
        run: >-
          cmake --build build-windows-shared
          --config Release
          --target apta_core apta_abi_layout_manifest apta_compat_1_0_client
          --parallel 2

      - name: Stage shared runtime beside ABI client
        run: >-
          cmake -E copy_if_different
          build-windows-shared/Release/apta.dll
          build-windows-shared/tests/Release/apta.dll

      - name: Run shared-library ABI, conformance and interchange tests
        run: >-
          ctest --test-dir build-windows-shared
          -C Release
          -R "^(apta\.abi\..*|apta\.conformance\.installed|apta\.interchange\.versioned)$"
          --timeout 600
          --verbose
          --output-on-failure

      - name: Upload Windows conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apta-conformance-windows-attempt-${{ github.run_attempt }}
          path: |
            build-windows/conformance-reports/*.json
            build-windows-shared/conformance-reports/*.json
          if-no-files-found: warn
          retention-days: 30

  core-build-32:
    name: 32-bit core build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          persist-credentials: false

      - name: Install multilib toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Configure
        env:
          CFLAGS: -m32
          CXXFLAGS: -m32
          LDFLAGS: -m32
        run: >-
          cmake -S . -B build-32
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF
          -DAPTA_BUILD_TOOLS=OFF
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile library and tests
        run: cmake --build build-32 --parallel 2

      - name: Run tests
        run: ctest --test-dir build-32 --output-on-failure

      - name: Upload ILP32 conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apta-conformance-ilp32-attempt-${{ github.run_attempt }}
          path: build-32/conformance-reports/*.json
          if-no-files-found: warn
          retention-days: 30

  parser-hardening:
    name: P7 security and fuzz release campaign
    runs-on: ubuntu-latest

    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          persist-credentials: false

      - name: Configure sanitized parser build
        run: >-
          cmake -S . -B build-sanitized
          -DAPTA_BUILD_TESTS=ON
          -DAPTA_ENABLE_SANITIZERS=ON
          -DAPTA_BUILD_FUZZING=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Compile sanitized tests and seed generators
        run: cmake --build build-sanitized --parallel 2

      - name: Run sanitized runtime tests
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Verify frozen security-review invariants
        run: >-
          python3 security/review/check_invariants.py
          --root .
          --manifest security/review/invariants-v1.json
          --source-revision "${APTA_SOURCE_REVISION}"
          --output build-sanitized/security-reports/security-invariants.json

      - name: Generate canonical fuzz seeds
        run: |
          mkdir -p build-sanitized/fuzz-generated
          cd build-sanitized/fuzz-generated
          ../tests/apta_wovr_seed_generator
          ../tests/apta_s6_seed_generator
          test -s valid-final.apta
          test -s valid-sparse-partial.apta
          test -s valid-wdtl.apta
          test -s valid-meta.apta
          test -s valid-s4.apta
          test -s valid-s6.apta

      - name: Build frozen P7 fuzz target inventory
        run: >-
          python3 tests/fuzz/build_campaign_targets.py
          --source-root .
          --build-dir build-sanitized
          --campaign tests/fuzz/campaign-v1.json
          --cc clang

      - name: Materialize versioned seed corpora
        run: >-
          python3 tests/fuzz/prepare_corpora.py
          --policy tests/fuzz/campaign-v1.json
          --manifest tests/fuzz/corpus-v1.json
          --generated build-sanitized/fuzz-generated
          --output build-sanitized/fuzz-corpora
          --source-root .
          --source-revision "${APTA_SOURCE_REVISION}"

      - name: Run reproducible P7 release campaign
        run: >-
          python3 tests/fuzz/run_release_campaign.py
          --source-root .
          --build-dir build-sanitized
          --corpus-root build-sanitized/fuzz-corpora
          --campaign tests/fuzz/campaign-v1.json
          --source-revision "${APTA_SOURCE_REVISION}"
          --output build-sanitized/security-reports/fuzz-campaign.json

      - name: Upload P7 security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apta-security-campaign-attempt-${{ github.run_attempt }}
          path: |
            build-sanitized/security-reports/**
            build-sanitized/fuzz-corpora/corpus-report.json
            build-sanitized/conformance-reports/*.json
          if-no-files-found: error
          retention-days: 90
