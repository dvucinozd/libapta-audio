name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-build:
    name: Public headers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DAPTA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Compile C and C++ header checks
        run: cmake --build build --parallel 2
