name: Patch musical key integration v2

on:
  push:
    branches: [dev/1.1-key]
    paths: [.github/workflows/_patch-key-integration-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev/1.1-key
      - name: Apply integration patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {n}: {old[:120]!r}")
              p.write_text(s.replace(old,new,count))

          # Internal key state/constants.
          replace('src/core/apta_internal.h',
              '#define APTA_INTERNAL_SAMPLE_MAGNITUDE_SCALE 32768.0f\n',
              '#define APTA_INTERNAL_SAMPLE_MAGNITUDE_SCALE 32768.0f\n\n'
              '#define APTA_INTERNAL_KEY_OCTAVES 3u\n'
              '#define APTA_INTERNAL_KEY_PITCH_CLASSES 12u\n'
              '#define APTA_INTERNAL_KEY_BIN_COUNT (APTA_INTERNAL_KEY_OCTAVES * APTA_INTERNAL_KEY_PITCH_CLASSES)\n'
              '#define APTA_INTERNAL_KEY_CANDIDATE_COUNT 3u\n'
              '#define APTA_INTERNAL_KEY_DECIMATION 4u\n'
              '#define APTA_INTERNAL_KEY_STABLE_WINDOWS 4u\n'
              '#define APTA_INTERNAL_KEY_PUBLISH_INTERVAL 4u\n')
          marker='typedef struct apta_internal_s6_session_state\n    apta_internal_s6_session_state_t;\n'
          keytype='''typedef struct {\n    float coefficients[APTA_INTERNAL_KEY_BIN_COUNT];\n    float q1[APTA_INTERNAL_KEY_BIN_COUNT];\n    float q2[APTA_INTERNAL_KEY_BIN_COUNT];\n    float chroma[APTA_INTERNAL_KEY_PITCH_CLASSES];\n    float decimation_sum;\n    uint32_t decimation_count;\n    uint32_t window_samples;\n    uint32_t window_target_samples;\n    uint32_t completed_windows;\n    uint32_t selected_windows;\n    apta_source_frame_t evidence_first_frame;\n    apta_source_frame_t evidence_end_frame;\n    apta_source_frame_t next_source_frame;\n    uint32_t has_next_source_frame;\n    uint32_t initialized;\n} apta_internal_key_analysis_t;\n\n'''
          replace('src/core/apta_internal.h', marker, keytype+marker)
          replace('src/core/apta_internal.h',
              '    uint64_t meter_published_serial;\n\n    apta_internal_s6_session_state_t *s6;\n',
              '    uint64_t meter_published_serial;\n\n'
              '    apta_internal_key_analysis_t key_analysis;\n'
              '    apta_key_view_t key_value;\n'
              '    apta_key_candidate_t key_candidates[APTA_INTERNAL_KEY_CANDIDATE_COUNT];\n'
              '    uint32_t has_key;\n'
              '    uint32_t key_reserved32;\n'
              '    uint64_t key_mutation_serial;\n'
              '    uint64_t key_published_serial;\n\n'
              '    apta_internal_s6_session_state_t *s6;\n')

          # Capabilities/config and dependency on PCM/overview processing.
          for path in ['src/core/apta_context.c','src/core/apta_config.c']:
              replace(path,
                  '        APTA_FEATURE_GRID_LOCKING |\n        APTA_FEATURE_METER_DOWNBEAT;\n',
                  '        APTA_FEATURE_GRID_LOCKING |\n        APTA_FEATURE_MUSICAL_KEY |\n        APTA_FEATURE_METER_DOWNBEAT;\n')
          replace('src/core/apta_config.c','    size_t meter_snapshots = 0u;\n',
                  '    size_t meter_snapshots = 0u;\n    size_t key_snapshots = 0u;\n')
          replace('src/core/apta_config.c',
                  '    if ((requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u) {\n        meter_snapshots = 2u * sizeof(apta_meter_segment_t);\n    }\n',
                  '    if ((requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u) {\n        meter_snapshots = 2u * sizeof(apta_meter_segment_t);\n    }\n'
                  '    if ((requested_features & APTA_FEATURE_MUSICAL_KEY) != 0u) {\n'
                  '        key_snapshots = 2u * APTA_INTERNAL_KEY_CANDIDATE_COUNT * sizeof(apta_key_candidate_t);\n'
                  '    }\n')
          replace('src/core/apta_config.c','           meter_snapshots;\n','           meter_snapshots +\n           key_snapshots;\n')
          replace('src/core/apta_config.c',
                  '        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_METER_DOWNBEAT |\n',
                  '        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_MUSICAL_KEY |\n        APTA_FEATURE_METER_DOWNBEAT |\n')

          # Feed every normalized mono sample into the key analyzer.
          replace('src/waveform/apta_waveform_process.c',
                  '#include "../core/apta_session_workspace.h"\n',
                  '#include "../core/apta_session_workspace.h"\n#include "../key/apta_key_internal.h"\n')
          replace('src/waveform/apta_waveform_process.c',
                  '        sample = node->samples[node->processed_frames + offset];\n        if (sample < accumulator->minimum) {\n',
                  '        sample = node->samples[node->processed_frames + offset];\n'
                  '        apta_internal_key_feed_sample(session, sample, source_frame);\n'
                  '        if (sample < accumulator->minimum) {\n')

          # Bounded result pool key candidate storage.
          replace('src/core/apta_result_pool_layout.h','    size_t meter_segments_offset;\n    size_t metadata_offset;\n',
                  '    size_t meter_segments_offset;\n    size_t key_candidates_offset;\n    size_t metadata_offset;\n')
          replace('src/core/apta_result_pool_layout.h','    uint32_t meter_segment_capacity;\n    uint32_t metadata_capacity;\n',
                  '    uint32_t meter_segment_capacity;\n    uint32_t key_candidate_capacity;\n    uint32_t metadata_capacity;\n')
          replace('src/core/apta_result_pool_layout.c','    uint32_t meter_segments;\n    size_t slot_offset;\n',
                  '    uint32_t meter_segments;\n    uint32_t key_candidates;\n    size_t slot_offset;\n')
          replace('src/core/apta_result_pool_layout.c',
                  '    meter_segments =\n        (config->requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u\n            ? 1u\n            : 0u;\n',
                  '    meter_segments =\n        (config->requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u\n            ? 1u\n            : 0u;\n'
                  '    key_candidates =\n        (config->requested_features & APTA_FEATURE_MUSICAL_KEY) != 0u\n            ? APTA_INTERNAL_KEY_CANDIDATE_COUNT\n            : 0u;\n')
          replace('src/core/apta_result_pool_layout.c',
                  '        !apta_pool_append_region(\n            &slot_offset,\n            alignof(uint8_t),\n            APTA_METADATA_MAX_TOTAL_BYTES,\n',
                  '        !apta_pool_append_region(\n            &slot_offset,\n            alignof(apta_key_candidate_t),\n            key_candidates,\n            sizeof(apta_key_candidate_t),\n            &layout_out->key_candidates_offset) ||\n'
                  '        !apta_pool_append_region(\n            &slot_offset,\n            alignof(uint8_t),\n            APTA_METADATA_MAX_TOTAL_BYTES,\n')
          replace('src/core/apta_result_pool_layout.c','    layout_out->meter_segment_capacity = meter_segments;\n    layout_out->metadata_capacity = APTA_METADATA_MAX_TOTAL_BYTES;\n',
                  '    layout_out->meter_segment_capacity = meter_segments;\n    layout_out->key_candidate_capacity = key_candidates;\n    layout_out->metadata_capacity = APTA_METADATA_MAX_TOTAL_BYTES;\n')

          # Root build: key wraps meter as the final process/snapshot/pool layer.
          anchor='''set_source_files_properties(\n    src/beatgrid/apta_s6_pool_snapshot.c\n    PROPERTIES\n        COMPILE_DEFINITIONS "APTA_INTERNAL_LAYER=1;apta_internal_result_pool_create_session_result=apta_internal_result_pool_create_session_result_meter_base")\n'''
          extra='''\nset_source_files_properties(\n    src/beatgrid/apta_meter_process.c\n    PROPERTIES\n        COMPILE_DEFINITIONS "APTA_INTERNAL_LAYER=1;apta_internal_waveform_process=apta_internal_waveform_process_key_base;apta_internal_analysis_pending=apta_internal_analysis_pending_key_base")\n\nset_source_files_properties(\n    src/beatgrid/apta_meter_snapshot.c\n    PROPERTIES\n        COMPILE_DEFINITIONS "APTA_INTERNAL_LAYER=1;apta_internal_waveform_build_snapshot=apta_internal_waveform_build_snapshot_key_base")\n\nset_source_files_properties(\n    src/beatgrid/apta_meter_pool_snapshot.c\n    PROPERTIES\n        COMPILE_DEFINITIONS "APTA_INTERNAL_LAYER=1;apta_internal_result_pool_create_session_result=apta_internal_result_pool_create_session_result_key_base")\n'''
          replace('CMakeLists.txt',anchor,anchor+extra)
          replace('CMakeLists.txt','        src/beatgrid/apta_meter_pool_snapshot.c\n        src/core/apta_config.c\n',
                  '        src/beatgrid/apta_meter_pool_snapshot.c\n        src/key/apta_key.c\n        src/key/apta_key_process.c\n        src/key/apta_key_snapshot.c\n        src/key/apta_key_pool_snapshot.c\n        src/core/apta_config.c\n')

          # ESP-IDF mirrors the wrapper/source chain.
          replace('ports/espidf/CMakeLists.txt','    "${APTA_ROOT}/src/beatgrid/apta_meter_pool_snapshot.c"\n',
                  '    "${APTA_ROOT}/src/beatgrid/apta_meter_pool_snapshot.c"\n    "${APTA_ROOT}/src/key/apta_key.c"\n    "${APTA_ROOT}/src/key/apta_key_process.c"\n    "${APTA_ROOT}/src/key/apta_key_snapshot.c"\n    "${APTA_ROOT}/src/key/apta_key_pool_snapshot.c"\n')
          anchor='''    set_source_files_properties(\n        "${APTA_ROOT}/src/beatgrid/apta_s6_pool_snapshot.c"\n        PROPERTIES COMPILE_DEFINITIONS "apta_internal_result_pool_create_session_result=apta_internal_result_pool_create_session_result_meter_base")\n'''
          extra='''    set_source_files_properties(\n        "${APTA_ROOT}/src/beatgrid/apta_meter_process.c"\n        PROPERTIES COMPILE_DEFINITIONS "apta_internal_waveform_process=apta_internal_waveform_process_key_base;apta_internal_analysis_pending=apta_internal_analysis_pending_key_base")\n    set_source_files_properties(\n        "${APTA_ROOT}/src/beatgrid/apta_meter_snapshot.c"\n        PROPERTIES COMPILE_DEFINITIONS "apta_internal_waveform_build_snapshot=apta_internal_waveform_build_snapshot_key_base")\n    set_source_files_properties(\n        "${APTA_ROOT}/src/beatgrid/apta_meter_pool_snapshot.c"\n        PROPERTIES COMPILE_DEFINITIONS "apta_internal_result_pool_create_session_result=apta_internal_result_pool_create_session_result_key_base")\n'''
          replace('ports/espidf/CMakeLists.txt',anchor,anchor+extra)

          # Unit test and capability fixture.
          with Path('tests/CMakeLists.txt').open('a') as f:
              f.write('\n# APTA 1.1 native musical-key detector\n')
              f.write('apta_add_c_test(apta_musical_key apta.dj.musical_key unit/musical_key.c)\n')
              f.write('target_include_directories(apta_musical_key PRIVATE ${CMAKE_SOURCE_DIR}/src/core ${CMAKE_SOURCE_DIR}/src/key)\n')
          replace('tests/unit/core_smoke.c','           APTA_FEATURE_GRID_LOCKING |\n           APTA_FEATURE_METER_DOWNBEAT));\n',
                  '           APTA_FEATURE_GRID_LOCKING |\n           APTA_FEATURE_MUSICAL_KEY |\n           APTA_FEATURE_METER_DOWNBEAT));\n')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src ports CMakeLists.txt tests
          git commit -m "Integrate native musical-key detector"
          git push origin HEAD:dev/1.1-key
