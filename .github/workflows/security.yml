name: Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "examples/**"
      - "tools/**"
      - "ports/**"
      - "security/**"
      - "release/generate_spdx_sbom.py"
      - "release/test_spdx_sbom.py"
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "examples/**"
      - "tools/**"
      - "ports/**"
      - "security/**"
      - "release/generate_spdx_sbom.py"
      - "release/test_spdx_sbom.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APTA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  codeql:
    name: CodeQL / C and C++
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: cpp
          build-mode: manual
          queries: security-extended

      - name: Configure analyzed build
        run: >-
          cmake -S . -B build-codeql
          -DAPTA_BUILD_TESTS=OFF
          -DAPTA_BUILD_EXAMPLES=ON
          -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF
          -DAPTA_BUILD_TOOLS=OFF
          -DAPTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile analyzed build
        run: cmake --build build-codeql --parallel 2

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:cpp"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          persist-credentials: false

      - name: Detect dependency graph availability
        id: dependency_graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(
            curl --silent --show-error --location \
              --output "${response}" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          )"
          case "${status}" in
            200|202)
              echo "available=true" >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo "available=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::GitHub dependency graph is disabled; full dependency review is unavailable until a repository owner enables it."
              ;;
            *)
              cat "${response}" >&2
              echo "unexpected dependency-graph API status: ${status}" >&2
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency_graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never

      - name: Enforce fallback supply-chain checks
        if: steps.dependency_graph.outputs.available != 'true'
        run: >-
          python3 security/automation/check_workflow_pins.py
          --root .
          --output build/security/dependency-review-fallback.json
