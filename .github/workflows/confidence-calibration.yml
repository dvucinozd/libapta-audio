name: Confidence calibration contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-contract:
    name: Task 6 calibration contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile calibration tooling
        run: python3 -m py_compile tools/apta_confidence_calibration.py tests/unit/apta_confidence_calibration.py
      - name: Run calibration unit tests
        run: python3 -m unittest tests/unit/apta_confidence_calibration.py
      - name: Verify protocol is present
        run: test -s docs/status/APTA-1.1-CONFIDENCE-CALIBRATION-PROTOCOL.md
