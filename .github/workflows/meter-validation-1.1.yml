name: APTA 1.1 meter validation tooling

on:
  push:
    paths:
      - "tools/apta_1_1_asap_meter_validation.py"
      - "tools/apta_1_1_ballroom_meter_validation.py"
      - "tests/unit/apta_1_1_asap_meter_validation.py"
      - "tests/unit/apta_1_1_ballroom_meter_validation.py"
      - ".github/workflows/meter-validation-1.1.yml"
  pull_request:
    paths:
      - "tools/apta_1_1_asap_meter_validation.py"
      - "tools/apta_1_1_ballroom_meter_validation.py"
      - "tests/unit/apta_1_1_asap_meter_validation.py"
      - "tests/unit/apta_1_1_ballroom_meter_validation.py"
      - ".github/workflows/meter-validation-1.1.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tooling
        run: >-
          python3 -m py_compile
          tools/apta_1_1_asap_meter_validation.py
          tools/apta_1_1_ballroom_meter_validation.py
          tests/unit/apta_1_1_asap_meter_validation.py
          tests/unit/apta_1_1_ballroom_meter_validation.py
      - name: Run deterministic selection and scoring tests
        run: >-
          python3 -m unittest
          tests/unit/apta_1_1_asap_meter_validation.py
          tests/unit/apta_1_1_ballroom_meter_validation.py
