name: Patch meter integration

on:
  push:
    branches: [dev/1.1-algorithms]
    paths: [.github/workflows/_patch-meter-integration.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev/1.1-algorithms
      - name: Apply exact meter integration patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(s.replace(old, new, count))

          # Keep meter working storage bounded for embedded targets.
          replace(
              "src/beatgrid/apta_meter_internal.h",
              "#define APTA_INTERNAL_METER_STABLE_BEATS 24u\n",
              "#define APTA_INTERNAL_METER_STABLE_BEATS 24u\n#define APTA_INTERNAL_METER_MAX_BEATS 128u\n")
          replace(
              "src/beatgrid/apta_meter.c",
              "    float strengths[APTA_INTERNAL_ONSET_BIN_CAPACITY /\n                    APTA_INTERNAL_MIN_TEMPO_BINS * 256u];\n",
              "    float strengths[APTA_INTERNAL_METER_MAX_BEATS];\n")

          # Session-owned meter state.
          replace(
              "src/core/apta_internal.h",
              "    apta_internal_s6_session_state_t *s6;\n};\n",
              "    apta_meter_segment_t meter_segment;\n    uint32_t has_meter;\n    uint32_t meter_reserved32;\n    uint64_t meter_source_s4_serial;\n    uint64_t meter_mutation_serial;\n    uint64_t meter_published_serial;\n\n    apta_internal_s6_session_state_t *s6;\n};\n")

          # Advertise and validate the new native feature.
          replace(
              "src/core/apta_context.c",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_GRID_LOCKING;\n",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_GRID_LOCKING |\n        APTA_FEATURE_METER_DOWNBEAT;\n")
          replace(
              "src/core/apta_config.c",
              "    size_t s6_snapshots = 0u;\n",
              "    size_t s6_snapshots = 0u;\n    size_t meter_snapshots = 0u;\n")
          replace(
              "src/core/apta_config.c",
              "    if ((requested_features & APTA_INTERNAL_S6_FEATURES) != 0u) {\n",
              "    if ((requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u) {\n        meter_snapshots = 2u * sizeof(apta_meter_segment_t);\n    }\n    if ((requested_features & APTA_INTERNAL_S6_FEATURES) != 0u) {\n")
          replace(
              "src/core/apta_config.c",
              "           s4_snapshots +\n           s6_session +\n           s6_snapshots;\n",
              "           s4_snapshots +\n           s6_session +\n           s6_snapshots +\n           meter_snapshots;\n")
          replace(
              "src/core/apta_config.c",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_GRID_LOCKING;\n",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_GRID_LOCKING |\n        APTA_FEATURE_METER_DOWNBEAT;\n")
          replace(
              "src/core/apta_config.c",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_INTERNAL_S4_FEATURES |\n        APTA_INTERNAL_S6_FEATURES;\n",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_METER_DOWNBEAT |\n        APTA_INTERNAL_S4_FEATURES |\n        APTA_INTERNAL_S6_FEATURES;\n")
          replace(
              "src/core/apta_config.c",
              "    if ((config->requested_features & APTA_FEATURE_GRID_LOCKING) != 0u &&\n        (config->requested_features &\n         APTA_FEATURE_LOCAL_BEATGRID) == 0u) {\n        return APTA_ERROR_INVALID_ARGUMENT;\n    }\n",
              "    if ((config->requested_features & APTA_FEATURE_GRID_LOCKING) != 0u &&\n        (config->requested_features &\n         APTA_FEATURE_LOCAL_BEATGRID) == 0u) {\n        return APTA_ERROR_INVALID_ARGUMENT;\n    }\n    if ((config->requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u &&\n        (config->requested_features & APTA_FEATURE_LOCAL_BEATGRID) == 0u) {\n        return APTA_ERROR_INVALID_ARGUMENT;\n    }\n")

          replace(
              "src/core/apta_session_detail_contract.c",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_INTERNAL_S4_FEATURES |\n        APTA_INTERNAL_S6_FEATURES;\n",
              "        APTA_FEATURE_CONFIDENCE |\n        APTA_FEATURE_METER_DOWNBEAT |\n        APTA_INTERNAL_S4_FEATURES |\n        APTA_INTERNAL_S6_FEATURES;\n")
          replace(
              "src/core/apta_session_detail_contract.c",
              "    if ((feature_mask & APTA_FEATURE_GRID_LOCKING) != 0u &&\n        (feature_mask & APTA_FEATURE_LOCAL_BEATGRID) == 0u) {\n        return 0;\n    }\n",
              "    if ((feature_mask & APTA_FEATURE_GRID_LOCKING) != 0u &&\n        (feature_mask & APTA_FEATURE_LOCAL_BEATGRID) == 0u) {\n        return 0;\n    }\n    if ((feature_mask & APTA_FEATURE_METER_DOWNBEAT) != 0u &&\n        (feature_mask & APTA_FEATURE_LOCAL_BEATGRID) == 0u) {\n        return 0;\n    }\n")
          replace(
              "src/core/apta_session_detail_contract.c",
              "          APTA_FEATURE_LOCAL_BEATGRID |\n          APTA_FEATURE_GLOBAL_BEATGRID)) == 0u) {\n",
              "          APTA_FEATURE_LOCAL_BEATGRID |\n          APTA_FEATURE_GLOBAL_BEATGRID |\n          APTA_FEATURE_METER_DOWNBEAT)) == 0u) {\n")
          replace(
              "src/core/apta_session_detail_contract.c",
              "         (APTA_INTERNAL_S4_FEATURES | APTA_INTERNAL_S6_FEATURES)) != 0u) {\n",
              "         (APTA_INTERNAL_S4_FEATURES | APTA_INTERNAL_S6_FEATURES |\n          APTA_FEATURE_METER_DOWNBEAT)) != 0u) {\n",
              2)

          # Reserve one meter segment per bounded result slot.
          replace(
              "src/core/apta_result_pool_layout.h",
              "    size_t global_grid_beats_offset;\n    size_t metadata_offset;\n",
              "    size_t global_grid_beats_offset;\n    size_t meter_segments_offset;\n    size_t metadata_offset;\n")
          replace(
              "src/core/apta_result_pool_layout.h",
              "    uint32_t global_grid_beat_capacity;\n    uint32_t metadata_capacity;\n",
              "    uint32_t global_grid_beat_capacity;\n    uint32_t meter_segment_capacity;\n    uint32_t metadata_capacity;\n")
          replace(
              "src/core/apta_result_pool_layout.c",
              "    uint32_t global_grid_beats;\n    size_t slot_offset;\n",
              "    uint32_t global_grid_beats;\n    uint32_t meter_segments;\n    size_t slot_offset;\n")
          replace(
              "src/core/apta_result_pool_layout.c",
              "    global_grid_beats = global_grid_state != 0u\n                            ? APTA_INTERNAL_GLOBAL_MAX_BEATS\n                            : 0u;\n",
              "    global_grid_beats = global_grid_state != 0u\n                            ? APTA_INTERNAL_GLOBAL_MAX_BEATS\n                            : 0u;\n    meter_segments =\n        (config->requested_features & APTA_FEATURE_METER_DOWNBEAT) != 0u\n            ? 1u\n            : 0u;\n")
          replace(
              "src/core/apta_result_pool_layout.c",
              "        !apta_pool_append_region(\n            &slot_offset,\n            alignof(uint8_t),\n            APTA_METADATA_MAX_TOTAL_BYTES,\n",
              "        !apta_pool_append_region(\n            &slot_offset,\n            alignof(apta_meter_segment_t),\n            meter_segments,\n            sizeof(apta_meter_segment_t),\n            &layout_out->meter_segments_offset) ||\n        !apta_pool_append_region(\n            &slot_offset,\n            alignof(uint8_t),\n            APTA_METADATA_MAX_TOTAL_BYTES,\n")
          replace(
              "src/core/apta_result_pool_layout.c",
              "    layout_out->global_grid_beat_capacity = global_grid_beats;\n    layout_out->metadata_capacity = APTA_METADATA_MAX_TOTAL_BYTES;\n",
              "    layout_out->global_grid_beat_capacity = global_grid_beats;\n    layout_out->meter_segment_capacity = meter_segments;\n    layout_out->metadata_capacity = APTA_METADATA_MAX_TOTAL_BYTES;\n")

          # Root wrapper chain and source inventory.
          replace(
              "CMakeLists.txt",
              "set_source_files_properties(\n    src/tempo/apta_s4_process.c\n    PROPERTIES\n        COMPILE_DEFINITIONS \"APTA_INTERNAL_LAYER=1;apta_internal_waveform_process=apta_internal_waveform_process_s6_base\")\n",
              "set_source_files_properties(\n    src/tempo/apta_s4_process.c\n    PROPERTIES\n        COMPILE_DEFINITIONS \"APTA_INTERNAL_LAYER=1;apta_internal_waveform_process=apta_internal_waveform_process_s6_base\")\n\nset_source_files_properties(\n    src/beatgrid/apta_s6_process.c\n    PROPERTIES\n        COMPILE_DEFINITIONS \"APTA_INTERNAL_LAYER=1;apta_internal_waveform_process=apta_internal_waveform_process_meter_base;apta_internal_analysis_pending=apta_internal_analysis_pending_meter_base\")\n\nset_source_files_properties(\n    src/waveform/apta_waveform_snapshot_combined.c\n    PROPERTIES\n        COMPILE_DEFINITIONS \"APTA_INTERNAL_LAYER=1;apta_internal_waveform_build_snapshot=apta_internal_waveform_build_snapshot_meter_base\")\n\nset_source_files_properties(\n    src/beatgrid/apta_s6_pool_snapshot.c\n    PROPERTIES\n        COMPILE_DEFINITIONS \"APTA_INTERNAL_LAYER=1;apta_internal_result_pool_create_session_result=apta_internal_result_pool_create_session_result_meter_base\")\n")
          replace(
              "CMakeLists.txt",
              "        src/beatgrid/apta_s6_session_guard.c\n",
              "        src/beatgrid/apta_s6_session_guard.c\n        src/beatgrid/apta_meter.c\n        src/beatgrid/apta_meter_process.c\n        src/beatgrid/apta_meter_snapshot.c\n        src/beatgrid/apta_meter_pool_snapshot.c\n")

          # ESP-IDF mirrors the native wrapper chain.
          replace(
              "ports/espidf/CMakeLists.txt",
              "    \"${APTA_ROOT}/src/beatgrid/apta_s6_session_guard.c\"\n",
              "    \"${APTA_ROOT}/src/beatgrid/apta_s6_session_guard.c\"\n    \"${APTA_ROOT}/src/beatgrid/apta_meter.c\"\n    \"${APTA_ROOT}/src/beatgrid/apta_meter_process.c\"\n    \"${APTA_ROOT}/src/beatgrid/apta_meter_snapshot.c\"\n    \"${APTA_ROOT}/src/beatgrid/apta_meter_pool_snapshot.c\"\n")
          replace(
              "ports/espidf/CMakeLists.txt",
              "    set_source_files_properties(\n        \"${APTA_ROOT}/src/tempo/apta_s4_process.c\"\n        PROPERTIES COMPILE_DEFINITIONS \"apta_internal_waveform_process=apta_internal_waveform_process_s6_base\")\n",
              "    set_source_files_properties(\n        \"${APTA_ROOT}/src/tempo/apta_s4_process.c\"\n        PROPERTIES COMPILE_DEFINITIONS \"apta_internal_waveform_process=apta_internal_waveform_process_s6_base\")\n    set_source_files_properties(\n        \"${APTA_ROOT}/src/beatgrid/apta_s6_process.c\"\n        PROPERTIES COMPILE_DEFINITIONS \"apta_internal_waveform_process=apta_internal_waveform_process_meter_base;apta_internal_analysis_pending=apta_internal_analysis_pending_meter_base\")\n    set_source_files_properties(\n        \"${APTA_ROOT}/src/waveform/apta_waveform_snapshot_combined.c\"\n        PROPERTIES COMPILE_DEFINITIONS \"apta_internal_waveform_build_snapshot=apta_internal_waveform_build_snapshot_meter_base\")\n    set_source_files_properties(\n        \"${APTA_ROOT}/src/beatgrid/apta_s6_pool_snapshot.c\"\n        PROPERTIES COMPILE_DEFINITIONS \"apta_internal_result_pool_create_session_result=apta_internal_result_pool_create_session_result_meter_base\")\n")

          # Unit target; atomics flag is required on MSVC because internal.h is used.
          replace(
              "tests/CMakeLists.txt",
              "apta_add_c_test(apta_s6_allocation_failure apta.serialization.s6_allocation_failure unit/s6_allocation_failure.c)\n",
              "apta_add_c_test(apta_s6_allocation_failure apta.serialization.s6_allocation_failure unit/s6_allocation_failure.c)\napta_add_c_test(\n    apta_meter_downbeat\n    apta.dj.meter_downbeat\n    unit/meter_downbeat.c)\ntarget_link_libraries(apta_meter_downbeat PRIVATE apta_c11_atomics)\ntarget_include_directories(\n    apta_meter_downbeat\n    PRIVATE ${CMAKE_SOURCE_DIR}/src/core ${CMAKE_SOURCE_DIR}/src/beatgrid)\n")

      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
          grep -R "APTA_INTERNAL_METER_MAX_BEATS" -n src/beatgrid
          grep -R "meter_segment_capacity" -n src/core
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt ports/espidf/CMakeLists.txt tests/CMakeLists.txt src/core src/beatgrid
          git commit -m "Integrate native meter and downbeat detection"
          git push origin HEAD:dev/1.1-algorithms
