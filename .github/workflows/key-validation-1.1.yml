name: APTA 1.1 key validation tooling

on:
  push:
    paths:
      - "tools/apta_1_1_giantsteps_key_validation.py"
      - "tools/apta_1_1_giantsteps_original_key_development.py"
      - "tests/unit/apta_1_1_giantsteps_key_validation.py"
      - "tests/unit/apta_1_1_giantsteps_original_key_development.py"
      - ".github/workflows/key-validation-1.1.yml"
  pull_request:
    paths:
      - "tools/apta_1_1_giantsteps_key_validation.py"
      - "tools/apta_1_1_giantsteps_original_key_development.py"
      - "tests/unit/apta_1_1_giantsteps_key_validation.py"
      - "tests/unit/apta_1_1_giantsteps_original_key_development.py"
      - ".github/workflows/key-validation-1.1.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tooling
        run: |
          python3 -m py_compile \
            tools/apta_1_1_giantsteps_key_validation.py \
            tools/apta_1_1_giantsteps_original_key_development.py \
            tests/unit/apta_1_1_giantsteps_key_validation.py \
            tests/unit/apta_1_1_giantsteps_original_key_development.py
      - name: Run unit tests
        run: >-
          python3 -m unittest
          tests/unit/apta_1_1_giantsteps_key_validation.py
          tests/unit/apta_1_1_giantsteps_original_key_development.py
