name: DJ acceptance contract

on:
  pull_request:
    paths:
      - "tools/apta_1_1_dj_acceptance_eval.py"
      - "docs/status/APTA-1.1-DJ-ACCEPTANCE-PROTOCOL.md"
      - ".github/workflows/dj-acceptance-contract.yml"
  push:
    branches:
      - main
    paths:
      - "tools/apta_1_1_dj_acceptance_eval.py"
      - "docs/status/APTA-1.1-DJ-ACCEPTANCE-PROTOCOL.md"
      - ".github/workflows/dj-acceptance-contract.yml"

permissions:
  contents: read

jobs:
  evaluator-contract:
    name: Frozen DJ acceptance evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile evaluator
        run: python3 -m py_compile tools/apta_1_1_dj_acceptance_eval.py

      - name: Run evaluator self-test
        run: python3 tools/apta_1_1_dj_acceptance_eval.py --self-test
