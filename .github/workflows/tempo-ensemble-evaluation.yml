name: Tempo ensemble evaluation gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-contract:
    name: Task 5 evaluator contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile evaluator
        run: python3 -m py_compile tools/apta_1_1_tempo_ensemble_eval.py tests/unit/apta_1_1_tempo_ensemble_evaluation.py
      - name: Run evaluator unit tests
        run: python3 -m unittest tests/unit/apta_1_1_tempo_ensemble_evaluation.py
      - name: Verify no private corpus fields are committed
        run: |
          set -euo pipefail
          if git grep -n -E '"(artist|title|audio_path|source_path)"[[:space:]]*:' -- 'docs/status/*TEMPO*' 'tests/unit/apta_1_1_tempo_ensemble_evaluation.py' 'tools/apta_1_1_tempo_ensemble_eval.py'; then
            echo "private corpus field detected in tracked Task-5 evidence tooling" >&2
            exit 1
          fi
