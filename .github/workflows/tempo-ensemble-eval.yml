name: Tempo ensemble evaluation harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test frozen evaluator
        run: python3 tests/unit/tempo_ensemble_eval.py
      - name: Syntax check evaluator
        run: python3 -m py_compile tools/apta_tempo_ensemble_eval.py tests/unit/tempo_ensemble_eval.py
