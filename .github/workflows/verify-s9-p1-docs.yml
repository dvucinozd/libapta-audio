name: Verify S9 P1 documentation

on:
  push:
    branches:
      - agent/s9-p1-normative-scope
    paths:
      - .github/workflows/verify-s9-p1-docs.yml

permissions:
  contents: write

jobs:
  verify-report-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/s9-p1-normative-scope

      - name: Generate documentation verification report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.').resolve()
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True).splitlines()
          markdown = [Path(p) for p in changed if p.endswith('.md') and Path(p).exists()]

          whitespace = subprocess.run(
              ['git', 'diff', '--check', 'origin/main...HEAD'],
              text=True,
              capture_output=True)

          missing = []
          for path in markdown:
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  raw = match.group(1).strip()
                  if not raw or raw.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = raw.split('#', 1)[0]
                  if not target:
                      continue
                  if not (path.parent / target).resolve().exists():
                      missing.append((str(path), raw))

          passed = whitespace.returncode == 0 and not missing
          lines = [
              '# Stage S9 P1 documentation verification',
              '',
              f'**Result:** {"PASS" if passed else "FAIL"}  ',
              f'**Scope:** {len(markdown)} changed Markdown files relative to `origin/main`',
              '',
              '## Whitespace',
              '',
          ]
          if whitespace.returncode == 0:
              lines.append('`git diff --check origin/main...HEAD` passed.')
          else:
              lines += ['```text', whitespace.stdout + whitespace.stderr, '```']

          lines += ['', '## Local links', '']
          if not missing:
              lines.append('Every local Markdown link in the changed files resolves in the checked-out tree.')
          else:
              for path, target in missing:
                  lines.append(f'- `{path}` → `{target}`')

          lines += [
              '',
              '## Interpretation',
              '',
              'This report checks repository-local Markdown targets and whitespace for the P1 diff. External URLs and anchor existence inside a target file are outside this bounded gate.',
              '',
          ]
          Path('docs/status/S9-P1-DOCUMENTATION-CHECK.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit report and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-s9-p1-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(s9): record P1 documentation verification"
          git push origin HEAD:agent/s9-p1-normative-scope
