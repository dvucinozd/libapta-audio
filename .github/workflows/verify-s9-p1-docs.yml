name: Verify S9 P1 documentation

on:
  push:
    branches:
      - agent/s9-p1-normative-scope
    paths:
      - .github/workflows/verify-s9-p1-docs.yml

permissions:
  contents: write

jobs:
  verify-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/s9-p1-normative-scope

      - name: Check whitespace and local Markdown links
        shell: bash
        run: |
          set -euo pipefail
          git diff --check main...HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.').resolve()
          missing = []
          for path in root.rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  target = match.group(1).strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = target.split('#', 1)[0]
                  if not target:
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      missing.append((path.relative_to(root), match.group(1)))

          if missing:
              for path, target in missing:
                  print(f'{path}: missing local link target {target}', file=sys.stderr)
              raise SystemExit(1)
          print('All local Markdown links resolve.')
          PY

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-s9-p1-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(s9): record successful P1 documentation verification"
          git push origin HEAD:agent/s9-p1-normative-scope
