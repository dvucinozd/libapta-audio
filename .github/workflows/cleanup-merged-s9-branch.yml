name: Cleanup merged S9 branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-s9-branch.yml

permissions:
  contents: write

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged audit branch
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/s9-freeze-audit"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi
