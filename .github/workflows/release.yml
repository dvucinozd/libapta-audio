name: APTA stable release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "VERSION"
      - "CHANGELOG.md"
      - "include/apta/apta_version.h"
      - "release/**"
      - "specification/**"
      - "conformance/**"
      - "ports/espidf/idf_component.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "VERSION"
      - "CHANGELOG.md"
      - "include/apta/apta_version.h"
      - "release/**"
      - "specification/**"
      - "conformance/**"
      - "ports/espidf/idf_component.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APTA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      manifest: ${{ steps.release.outputs.manifest }}
      legal_manifest: ${{ steps.release.outputs.legal_manifest }}
      notes: ${{ steps.release.outputs.notes }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          manifest="release/maintenance-release-${version}.json"
          legal_manifest="release/legal-review-${version}.json"
          notes="release/release-notes-${version}.md"
          test -f "${manifest}"
          test -f "${legal_manifest}"
          test -f "${notes}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"
          echo "legal_manifest=${legal_manifest}" >> "${GITHUB_OUTPUT}"
          git fetch --tags --force
          published=false
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            published=true
          fi
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"
          echo "published=${published}" >> "${GITHUB_OUTPUT}"

  existing-release:
    name: Existing release detected
    needs: metadata
    if: needs.metadata.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v${{ needs.metadata.outputs.version }} is already published; release packaging is skipped."

  verify:
    name: Maintenance and legal verification
    needs: metadata
    if: needs.metadata.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          fetch-depth: 0
      - name: Verify maintenance boundary
        run: >-
          python3 release/check_maintenance_release.py
          --root .
          --manifest "${{ needs.metadata.outputs.manifest }}"
          --source-revision "${APTA_SOURCE_REVISION}"
          --output release-reports/maintenance-release-report.json
      - name: Verify legal and license review
        run: >-
          python3 release/check_legal_review.py
          --root .
          --manifest "${{ needs.metadata.outputs.legal_manifest }}"
          --source-revision "${APTA_SOURCE_REVISION}"
          --output release-reports/legal-review-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apta-${{ needs.metadata.outputs.version }}-release-reports
          path: release-reports/*.json
          if-no-files-found: error
          retention-days: 365

  linux-packages:
    name: Linux deterministic packages
    needs: [metadata, verify]
    if: needs.metadata.outputs.published != 'true'
    runs-on: ubuntu-latest
    env:
      APTA_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
      - name: Build and validate static package
        run: |
          cmake -S . -B build-static -DAPTA_BUILD_TESTS=ON -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF -DAPTA_BUILD_TOOLS=OFF -DAPTA_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static --parallel 2
          ctest --test-dir build-static -R "^(apta\.package\..*|apta\.abi\.package_install|apta\.conformance\.installed|apta\.interchange\.versioned)$" --timeout 900 --output-on-failure
      - name: Build and validate shared package
        run: |
          cmake -S . -B build-shared -DBUILD_SHARED_LIBS=ON -DAPTA_BUILD_TESTS=ON -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF -DAPTA_BUILD_TOOLS=OFF -DAPTA_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-shared --target apta_core apta_abi_layout_manifest apta_compat_1_0_client --parallel 2
          ctest --test-dir build-shared -R "^(apta\.package\.build_tree|apta\.abi\.package_install|apta\.conformance\.installed|apta\.interchange\.versioned)$" --timeout 900 --output-on-failure
      - name: Build reproducible shared archives
        run: |
          cmake -S . -B build-shared-package -DBUILD_SHARED_LIBS=ON -DAPTA_BUILD_TESTS=OFF -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF -DAPTA_BUILD_TOOLS=OFF -DAPTA_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-shared-package --parallel 2
          mkdir -p build-shared-package/repro-a build-shared-package/repro-b
          SOURCE_DATE_EPOCH=1767225600 cpack --config build-shared-package/CPackConfig.cmake -B build-shared-package/repro-a
          SOURCE_DATE_EPOCH=1767225600 cpack --config build-shared-package/CPackConfig.cmake -B build-shared-package/repro-b
          mapfile -t a < <(find build-shared-package/repro-a -maxdepth 1 -type f -name '*.tar.gz' | sort)
          mapfile -t b < <(find build-shared-package/repro-b -maxdepth 1 -type f -name '*.tar.gz' | sort)
          test "${#a[@]}" -eq 1
          test "${#b[@]}" -eq 1
          test "$(sha256sum "${a[0]}" | cut -d' ' -f1)" = "$(sha256sum "${b[0]}" | cut -d' ' -f1)"
      - name: Stage archives and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          while IFS= read -r -d '' file; do
            cp "${file}" "release-artifacts/linux-static-$(basename "${file}")"
          done < <(find build-static/package-archive-test/binary-a -maxdepth 1 -type f -print0)
          while IFS= read -r -d '' file; do
            cp "${file}" "release-artifacts/linux-source-$(basename "${file}")"
          done < <(find build-static/package-archive-test/source-a -maxdepth 1 -type f -print0)
          while IFS= read -r -d '' file; do
            cp "${file}" "release-artifacts/linux-shared-$(basename "${file}")"
          done < <(find build-shared-package/repro-a -maxdepth 1 -type f -print0)
          evidence="apta-${APTA_RELEASE_VERSION}-linux-conformance-evidence.zip"
          python3 - "release-artifacts/${evidence}" <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZIP_DEFLATED, ZipFile
          selected = []
          for root_name in ("build-static", "build-shared"):
              for path in Path(root_name).rglob("*.json"):
                  if any(token in path.as_posix().lower() for token in ("conformance", "interchange", "package", "abi")):
                      selected.append(path)
          if not selected:
              raise SystemExit("no Linux evidence JSON files found")
          with ZipFile(argv[1], "w", compression=ZIP_DEFLATED) as archive:
              for path in sorted(set(selected)):
                  archive.write(path, path.as_posix())
          PY
          sha256sum "release-artifacts/${evidence}" > "release-artifacts/${evidence}.sha256"
          python3 release/generate_final_artifact_manifest.py --root release-artifacts --source-revision "${APTA_SOURCE_REVISION}" --platform linux-x86_64 --version "${APTA_RELEASE_VERSION}" --minimum-archives 4 --output "release-artifacts/apta-${APTA_RELEASE_VERSION}-linux-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: apta-${{ needs.metadata.outputs.version }}-linux
          path: release-artifacts/**
          if-no-files-found: error
          retention-days: 365

  windows-packages:
    name: Windows deterministic packages
    needs: [metadata, verify]
    if: needs.metadata.outputs.published != 'true'
    runs-on: windows-latest
    env:
      APTA_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
      - name: Build and validate static package
        run: |
          cmake -S . -B build-static -DAPTA_BUILD_TESTS=ON -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF -DAPTA_BUILD_TOOLS=OFF -DAPTA_WARNINGS_AS_ERRORS=ON
          cmake --build build-static --config Release --parallel 2
          ctest --test-dir build-static -C Release -R "^(apta\.package\..*|apta\.abi\.package_install|apta\.conformance\.installed|apta\.interchange\.versioned)$" --timeout 900 --output-on-failure
      - name: Build and validate shared package
        shell: pwsh
        run: |
          cmake -S . -B build-shared -DBUILD_SHARED_LIBS=ON -DAPTA_BUILD_TESTS=ON -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF -DAPTA_BUILD_TOOLS=OFF -DAPTA_WARNINGS_AS_ERRORS=ON
          cmake --build build-shared --config Release --target apta_core apta_abi_layout_manifest apta_compat_1_0_client --parallel 2
          Copy-Item build-shared/Release/apta.dll build-shared/tests/Release/apta.dll -Force
          ctest --test-dir build-shared -C Release -R "^(apta\.package\..*|apta\.abi\.package_install|apta\.conformance\.installed|apta\.interchange\.versioned)$" --timeout 900 --output-on-failure
      - name: Stage archives and evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Get-ChildItem build-static/package-archive-test/binary-a -File | Copy-Item -Destination release-artifacts
          Get-ChildItem build-static/package-archive-test/source-a -File | Copy-Item -Destination release-artifacts
          Get-ChildItem build-shared/package-archive-test/binary-a -File | Copy-Item -Destination release-artifacts
          $evidenceFiles = Get-ChildItem build-static,build-shared -Recurse -File -Filter *.json | Where-Object { $_.FullName -match "conformance|interchange|package|abi" }
          if (-not $evidenceFiles) { throw "no Windows evidence JSON files found" }
          New-Item -ItemType Directory -Force evidence-json | Out-Null
          $index = 0
          foreach ($file in $evidenceFiles) { $index++; Copy-Item $file.FullName ("evidence-json/{0:D4}-{1}" -f $index, $file.Name) }
          $evidence = "apta-$env:APTA_RELEASE_VERSION-windows-conformance-evidence.zip"
          Compress-Archive -Path evidence-json/* -DestinationPath "release-artifacts/$evidence" -Force
          $digest = (Get-FileHash "release-artifacts/$evidence" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $evidence" | Set-Content "release-artifacts/$evidence.sha256" -Encoding ascii
          python release/generate_final_artifact_manifest.py --root release-artifacts --source-revision "$env:APTA_SOURCE_REVISION" --platform windows-x86_64 --version "$env:APTA_RELEASE_VERSION" --minimum-archives 3 --output "release-artifacts/apta-$env:APTA_RELEASE_VERSION-windows-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: apta-${{ needs.metadata.outputs.version }}-windows
          path: release-artifacts/**
          if-no-files-found: error
          retention-days: 365

  publish:
    name: Publish stable release
    needs: [metadata, verify, linux-packages, windows-packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.metadata.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APTA_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      APTA_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      APTA_RELEASE_NOTES: ${{ needs.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APTA_SOURCE_REVISION }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: apta-${{ needs.metadata.outputs.version }}-*
          path: publish-assets
          merge-multiple: true
      - name: Add release documents
        run: |
          cp CHANGELOG.md "publish-assets/CHANGELOG-${APTA_RELEASE_VERSION}.md"
          cp specification/APTA-1.0-NORMATIVE-MANIFEST.md publish-assets/
          cp specification/APTA-1.0-ERRATA-1.md publish-assets/
          cp "${APTA_RELEASE_NOTES}" publish-assets/
      - name: Create immutable tag and release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${APTA_RELEASE_TAG}" >/dev/null; then
            echo "${APTA_RELEASE_TAG} already exists; publication is intentionally skipped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${APTA_RELEASE_TAG}" "${APTA_SOURCE_REVISION}" -m "APTA ${APTA_RELEASE_VERSION}"
          git push origin "refs/tags/${APTA_RELEASE_TAG}"
          mapfile -d '' assets < <(find publish-assets -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "${APTA_RELEASE_TAG}" "${assets[@]}" --verify-tag --title "APTA ${APTA_RELEASE_VERSION}" --notes-file "${APTA_RELEASE_NOTES}"
