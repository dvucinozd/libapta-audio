name: Cleanup obsolete branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete merged branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "agent/phase4-rekordbox-corpus"
            "agent/phase5-tempo-generalization"
            "agent/refresh-current-docs"
            "agent/work-order-a1-a5"
            "agent/work-order-closure"
            "search-claude-2642049695912814362"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            else
              printf 'Branch already absent: %s\n' "${branch}"
            fi
          done
