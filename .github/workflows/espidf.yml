name: ESP-IDF

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "ports/espidf/**"
      - "examples/espidf/**"
      - "interoperability/**"
      - "tests/fixtures/container-v1-suite/v1-all-standard-sections.apta.hex"
      - "tests/unit/espidf_port.c"
      - "tests/unit/espidf_memory_profiles.c"
      - "tests/stubs/espidf/**"
      - ".github/workflows/espidf.yml"
      - "release/**"
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "ports/espidf/**"
      - "examples/espidf/**"
      - "interoperability/**"
      - "tests/fixtures/container-v1-suite/v1-all-standard-sections.apta.hex"
      - "tests/unit/espidf_port.c"
      - "tests/unit/espidf_memory_profiles.c"
      - "tests/stubs/espidf/**"
      - ".github/workflows/espidf.yml"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: espidf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Bounded embedded memory profiles
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run profiles
        run: |
          cmake -S . -B build-profiles \
            -DAPTA_BUILD_TESTS=OFF \
            -DAPTA_BUILD_DESKTOP_ADAPTERS=OFF \
            -DAPTA_BUILD_TOOLS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-profiles --parallel 2
          cc -std=c11 -Wall -Wextra -Wpedantic \
            -Iinclude \
            tests/unit/espidf_memory_profiles.c \
            build-profiles/libapta.a -lm \
            -o build-profiles/apta-espidf-memory-profiles
          ./build-profiles/apta-espidf-memory-profiles

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP-IDF 5.5.4 / ESP32 / scalar
            artifact: idf55-esp32
            image: espressif/idf:v5.5.4
            target: esp32
            build_dir: build-idf55-esp32
            defaults: sdkconfig.defaults
          - name: ESP-IDF 6.0.2 / ESP32 / scalar
            artifact: idf60-esp32
            image: espressif/idf:v6.0.2
            target: esp32
            build_dir: build-idf60-esp32
            defaults: sdkconfig.defaults
          - name: ESP-IDF 6.0.2 / ESP32-S3 / ESP-DSP
            artifact: idf60-esp32s3
            image: espressif/idf:v6.0.2
            target: esp32s3
            build_dir: build-idf60-esp32s3
            defaults: sdkconfig.defaults;sdkconfig.dsp.defaults

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build component and example
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/project"
          -w /project/examples/espidf/cooperative_scheduler
          ${{ matrix.image }}
          idf.py -B ${{ matrix.build_dir }}
          -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}"
          set-target ${{ matrix.target }} build size-components

      - name: Verify firmware artifact
        run: >-
          test -s
          examples/espidf/cooperative_scheduler/${{ matrix.build_dir }}/apta_cooperative_scheduler.bin

      - name: Generate versioned interchange report
        run: |
          python3 interoperability/espidf_report.py \
            --firmware "examples/espidf/cooperative_scheduler/${{ matrix.build_dir }}/apta_cooperative_scheduler.bin" \
            --fixture-hex "tests/fixtures/container-v1-suite/v1-all-standard-sections.apta.hex" \
            --manifest "interoperability/manifest-v1.json" \
            --embedded-source "examples/espidf/cooperative_scheduler/main/apta_interchange_fixture.inc" \
            --probe-source "examples/espidf/cooperative_scheduler/main/interchange_probe.c" \
            --target "${{ matrix.target }}" \
            --toolchain-image "${{ matrix.image }}" \
            --source-revision "${GITHUB_SHA}" \
            --output "interchange-artifacts/${{ matrix.artifact }}/apta-interchange-report.json"

      - name: Upload ESP-IDF interchange evidence
        uses: actions/upload-artifact@v4
        with:
          name: apta-interchange-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: |
            interchange-artifacts/${{ matrix.artifact }}/apta-interchange-report.json
            examples/espidf/cooperative_scheduler/${{ matrix.build_dir }}/apta_cooperative_scheduler.bin
          if-no-files-found: error
          retention-days: 30
